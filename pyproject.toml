[project]
name = "kairos-backend"
version = "0.1.0"
description = "Career networking backend for Kairos"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.6,<3",
    "falkordb>=1.2,<2",
    "python-multipart>=0.0.20,<1",
    "pypdf>=6,<7",
    "pyjwt[crypto]>=2.9",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
markers = ["graph: requires a running FalkorDB instance"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
